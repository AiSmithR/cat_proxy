# Cat Proxy 示例配置文件
# 兼容 Clash 配置格式

# 基础配置
port: 7890              # HTTP 代理端口
socks-port: 7891        # SOCKS5 代理端口
allow-lan: false        # 是否允许局域网连接
mode: rule              # 代理模式: Rule (规则) / Global (全局) / Direct (直连) / Script (脚本)
log-level: info         # 日志级别: error / warning / info / debug / silent

# 外部控制器 (RESTful API)
external-controller: 127.0.0.1:9090
secret: ""              # API 密钥（可选）

# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip  # DNS 模式: redir-host (真实IP) / fake-ip (虚拟IP)
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5           # 阿里 DNS
    - 119.29.29.29        # 腾讯 DNS
  fallback:
    - 8.8.8.8             # Google DNS
    - 1.1.1.1             # Cloudflare DNS

# 代理节点
proxies:
  # Shadowsocks
  - name: "SS-HK"
    type: ss
    server: server.example.com
    port: 8388
    cipher: aes-256-gcm
    password: your-password

  # VMess
  - name: "VMess-US"
    type: vmess
    server: server.example.com
    port: 443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto

  # Trojan
  - name: "Trojan-JP"
    type: trojan
    server: server.example.com
    port: 443
    password: your-password

  # HTTP
  - name: "HTTP-Proxy"
    type: http
    server: proxy.example.com
    port: 8080
    username: user
    password: pass

  # SOCKS5
  - name: "SOCKS5-Proxy"
    type: socks5
    server: proxy.example.com
    port: 1080
    username: user
    password: pass

# 代理组
proxy-groups:
  # 自动选择组
  - name: "Auto"
    type: url-test
    proxies:
      - SS-HK
      - VMess-US
      - Trojan-JP
    url: 'http://www.gstatic.com/generate_204'
    interval: 300

  # 手动选择组
  - name: "Proxy"
    type: select
    proxies:
      - Auto
      - SS-HK
      - VMess-US
      - Trojan-JP
      - DIRECT

  # 全球直连
  - name: "Domestic"
    type: select
    proxies:
      - DIRECT
      - Proxy

# 规则
rules:
  # 本地网络直连
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT

  # 国内网站直连
  - DOMAIN-SUFFIX,cn,Domestic
  - DOMAIN-KEYWORD,baidu,Domestic
  - DOMAIN-KEYWORD,taobao,Domestic
  - DOMAIN-KEYWORD,qq,Domestic

  # 国外网站代理
  - DOMAIN-SUFFIX,google.com,Proxy
  - DOMAIN-SUFFIX,youtube.com,Proxy
  - DOMAIN-SUFFIX,twitter.com,Proxy
  - DOMAIN-SUFFIX,facebook.com,Proxy
  - DOMAIN-SUFFIX,github.com,Proxy

  # 广告拦截
  - DOMAIN-SUFFIX,ad.com,REJECT
  - DOMAIN-KEYWORD,analytics,REJECT

  # 默认规则
  - GEOIP,CN,Domestic
  - MATCH,Proxy

# 订阅配置（可选）
subscriptions:
  - name: "我的订阅"
    url: "https://example.com/subscribe"
    interval: 86400  # 更新间隔（秒），86400 = 24小时
